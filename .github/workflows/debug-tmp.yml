name: debug-tmp
on: [pull_request]
jobs:
  dbg:
    runs-on: ubuntu-latest
    env: { DISPLAY: ":99" }
    steps:
      - uses: actions/checkout@v4
        with: { path: PipeCompare }
      - run: git clone --depth 1 --branch 2024.2.1 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - run: sudo apt-get install -y -q xvfb && (Xvfb :99 -screen 0 1920x1080x24 &)
      - uses: matlab-actions/setup-matlab@v2
        with: { release: latest, products: Signal_Processing_Toolbox }
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui;
            cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            r = runtests('test_engine', 'ProcedureName', 'testVoltConversionScriptScalesIcaLikeTheSearch'); disp(r);
            disp('=====DIAG====='); for k = 1:numel(r), d = r(k).Details; try, disp(d.DiagnosticRecord.Report); catch, end; end
