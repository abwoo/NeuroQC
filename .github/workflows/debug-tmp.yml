name: debug-tmp
on: [pull_request]
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { DISPLAY: ":99" }
    steps:
      - uses: actions/checkout@v4
        with: { path: PipeCompare }
      - run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - run: sudo apt-get install -y -q xvfb && (Xvfb :99 -screen 0 1920x1080x24 &)
      - uses: matlab-actions/setup-matlab@v2
        with: { release: R2022b, products: Signal_Processing_Toolbox }
      - uses: matlab-actions/run-command@v2
        timeout-minutes: 8
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui;
            cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            t = timer('StartDelay', 240, 'TimerFcn', @(~,~) dbstack('-completenames')); 
            M = @(s) fprintf(2, '#### %s\n', s);
            EEG = nqc_synth(struct('seconds', 120, 'nPerCond', 30, 'alphaUv', 10)); nqc_setBase(EEG);
            M('A'); d = pipecompare.gui.SimpleDialog(EEG);
            d.EventList.Value = {'11', '31'}; d.MeasureDrop.Value = 'P3'; M('B'); d.measureChanged(); M('C');
            o = d.options(); M('D'); c = d.contract(o); M('E');
            app = pipecompare.gui.Panel(); M('F');
            [plan, notes] = pipecompare.simple.Presets.recipe(o.recipe, d.State, c, o.reference, pipecompare.simple.Presets.nonEegChannels(d.EEG)); M('G');
            app.Plan = plan; app.showPlan(); M('H');
            for k = 1:numel(c.conditions), app.addCondition(c.conditions(k).name, c.conditions(k).events); end; M('I');
            app.EpochField.Value = sprintf('%g %g', c.epoch); app.BaseField.Value = sprintf('%g %g', c.baseline); M('J');
            comp = c.components(1); app.addComponent(comp.name, comp.window, comp.roi, comp.measure, comp.polarity, {}); M('K');
            app.settingsChanged(); M('L'); d.close(); M('M');
            [~, noPz] = evalc('pop_select(EEG, ''rmchannel'', {''Pz''})'); M('N');
            d2 = pipecompare.gui.SimpleDialog(noPz); M('O');
            d2.EventList.Value = {'11'}; d2.MeasureDrop.Value = 'P3'; d2.measureChanged(); M('P');
            a = d2.advanced(); M('Q'); disp(isempty(a));
