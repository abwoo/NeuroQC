name: debug-tmp
on: [pull_request]
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { DISPLAY: ":99" }
    steps:
      - uses: actions/checkout@v4
        with: { path: PipeCompare }
      - run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - run: sudo apt-get install -y -q xvfb && (Xvfb :99 -screen 0 1920x1080x24 &)
      - uses: matlab-actions/setup-matlab@v2
        with: { release: R2022b, products: Signal_Processing_Toolbox }
      - name: plain uialert
        uses: matlab-actions/run-command@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            M = @(s) fprintf(2, '#### %s\n', s);
            f = uifigure; uialert(f, 'x', 'y'); M('done plain');
      - name: uialert after drawnow
        uses: matlab-actions/run-command@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            M = @(s) fprintf(2, '#### %s\n', s);
            f = uifigure; drawnow; uialert(f, 'x', 'y'); M('done drawnow');
      - name: uialert on dialog
        uses: matlab-actions/run-command@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            M = @(s) fprintf(2, '#### %s\n', s);
            EEG = nqc_synth(struct('seconds', 60)); [~, E] = evalc('pop_select(EEG, ''rmchannel'', {''Pz''})'); d = pipecompare.gui.SimpleDialog(E); M('made'); drawnow; M('drawn'); uialert(d.Fig, 'x', 'y'); M('done dialog');
      - name: uialert on dialog no drawnow
        uses: matlab-actions/run-command@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            M = @(s) fprintf(2, '#### %s\n', s);
            EEG = nqc_synth(struct('seconds', 60)); d = pipecompare.gui.SimpleDialog(EEG); M('made'); uialert(d.Fig, 'x', 'y'); M('done dialog2');
