name: debug-tmp
on: [pull_request]
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { DISPLAY: ":99" }
    steps:
      - uses: actions/checkout@v4
        with: { path: PipeCompare }
      - run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - run: sudo apt-get install -y -q xvfb && (Xvfb :99 -screen 0 1920x1080x24 &)
      - uses: matlab-actions/setup-matlab@v2
        with: { release: R2022b, products: Signal_Processing_Toolbox }
      - name: no panel
        uses: matlab-actions/run-command@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            M = @(s) fprintf(2, '#### %s\n', s);
            EEG = nqc_synth(struct('seconds', 120, 'nPerCond', 30, 'alphaUv', 10)); nqc_setBase(EEG);
            [~, noPz] = evalc('pop_select(EEG, ''rmchannel'', {''Pz''})');
            d2 = pipecompare.gui.SimpleDialog(noPz); d2.EventList.Value = {'11'}; d2.MeasureDrop.Value = 'P3'; d2.measureChanged(); M('P');
            o = d2.options(); M('opts');
            try, c = d2.contract(o); M('no error'); catch ME, M(['err: ' ME.message]); end
            uialert(d2.Fig, 'x', 'y'); M('alert done');
      - name: with panel
        uses: matlab-actions/run-command@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            M = @(s) fprintf(2, '#### %s\n', s);
            EEG = nqc_synth(struct('seconds', 120, 'nPerCond', 30, 'alphaUv', 10)); nqc_setBase(EEG);
            app = pipecompare.gui.Panel(); M('panel');
            [~, noPz] = evalc('pop_select(EEG, ''rmchannel'', {''Pz''})');
            d2 = pipecompare.gui.SimpleDialog(noPz); d2.EventList.Value = {'11'}; d2.MeasureDrop.Value = 'P3'; d2.measureChanged(); M('P');
            o = d2.options(); M('opts');
            try, c = d2.contract(o); M('no error'); catch ME, M(['err: ' ME.message]); end
            uialert(d2.Fig, 'x', 'y'); M('alert done');
