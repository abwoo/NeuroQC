name: diag mac progress

# Temporary: why uiprogressdlg reports Stop at once on MATLAB R2023b, macOS. Removed before merging.
on:
  pull_request:

jobs:
  diag:
    name: diag ${{ matrix.os }} ${{ matrix.matlab }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        matlab: [R2023b, R2024b]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab }}
      - name: probe
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp(version); system('sw_vers'); disp(get(0, 'ScreenSize'));
            f = uifigure('Position', [300 300 480 170]); fprintf('fig made, valid=%d\n', isvalid(f));
            d = uiprogressdlg(f, 'Title', 't', 'Cancelable', 'on', 'CancelText', 'Stop', 'Indeterminate', 'on');
            fprintf('A fig=%d dlg=%d\n', isvalid(f), isvalid(d));
            try, fprintf('A cancel=%d\n', d.CancelRequested); catch e, disp(e.message); end
            drawnow; pause(2); fprintf('B fig=%d dlg=%d\n', isvalid(f), isvalid(d));
            try, fprintf('B cancel=%d\n', d.CancelRequested); catch e, disp(e.message); end
            g = uifigure; drawnow; pause(3); fprintf('C fig=%d\n', isvalid(g));
            d3 = uiprogressdlg(g, 'Title', 't', 'Cancelable', 'on'); drawnow; pause(1);
            fprintf('C dlg=%d\n', isvalid(d3)); try, fprintf('C cancel=%d\n', d3.CancelRequested); catch e, disp(e.message); end
            h = uifigure; drawnow; pause(2); uialert(h, 'msg', 'title'); drawnow; pause(1); fprintf('D uialert returned, fig=%d\n', isvalid(h));
