name: diag uialert

# Temporary: finds why uialert on the simple dialog hangs on MATLAB R2022b
# and R2023a under Xvfb. Removed before merging.
on:
  pull_request:

jobs:
  diag:
    name: uialert ${{ matrix.matlab }} wm=${{ matrix.wm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        matlab: [R2022b, R2023a]
        wm: [none, fluxbox]
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4
        with:
          path: PipeCompare
      - run: git clone --depth 1 --branch 2026.0.0 --recurse-submodules --shallow-submodules https://github.com/sccn/eeglab.git eeglab
      - name: Display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb fluxbox
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          if [ "${{ matrix.wm }}" = fluxbox ]; then fluxbox > /dev/null 2>&1 & fi
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab }}
          products: Signal_Processing_Toolbox
      - name: V1 plain uifigure
        continue-on-error: true
        timeout-minutes: 5
        uses: matlab-actions/run-command@v2
        with:
          command: f = uifigure; uialert(f, 'a', 'b'); drawnow; disp('V1 OK'); delete(f);
      - name: V2 simple dialog
        continue-on-error: true
        timeout-minutes: 6
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            EEG = nqc_synth(struct('seconds', 60, 'nPerCond', 10)); nqc_setBase(EEG);
            d = pipecompare.gui.SimpleDialog(EEG); disp('V2 dialog made');
            uialert(d.Fig, 'a', 'b'); drawnow; disp('V2 OK');
      - name: V3 simple dialog, drawnow first
        continue-on-error: true
        timeout-minutes: 6
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            EEG = nqc_synth(struct('seconds', 60, 'nPerCond', 10)); nqc_setBase(EEG);
            d = pipecompare.gui.SimpleDialog(EEG); drawnow; pause(2); disp('V3 drawn');
            uialert(d.Fig, 'a', 'b'); drawnow; disp('V3 OK');
      - name: V4 the test path
        continue-on-error: true
        timeout-minutes: 8
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            EEG = nqc_synth(struct('seconds', 60, 'nPerCond', 10)); nqc_setBase(EEG);
            [~, noPz] = evalc('pop_select(EEG, ''nochannel'', {''Pz''})');
            d2 = pipecompare.gui.SimpleDialog(noPz); disp('V4 dialog made');
            d2.EventList.Value = {'11'}; d2.MeasureDrop.Value = 'P3'; d2.measureChanged(); disp('V4 measure set');
            a = d2.advanced(); disp('V4 OK');
      - name: V5 test_simple alone
        continue-on-error: true
        timeout-minutes: 20
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(fullfile(pwd, 'eeglab')); eeglab nogui; cd PipeCompare; addpath(pwd); addpath(fullfile(pwd, 'tests'));
            r = runtests('test_simple', 'ProcedureName', 'testAdvancedTakesTheChoicesOrSaysWhyNot'); disp(r);
