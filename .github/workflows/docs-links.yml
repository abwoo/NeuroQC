name: docs-links

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.html"
      - ".github/workflows/docs-links.yml"
  pull_request:
    paths:
      - "**.md"
      - "**.html"
      - ".github/workflows/docs-links.yml"
  workflow_dispatch:

jobs:
  lychee:
    name: Check relative documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Link check (offline: relative files + fragments)"
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments=full
            './README.md'
            './docs/**/*.md'
            './site/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
