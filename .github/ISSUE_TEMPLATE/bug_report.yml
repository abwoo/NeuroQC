name: Bug report
description: Something in NeuroQC does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never attach real subject data; a synthetic dataset
        (`tests/nqc_synth.m`) or a description of the data's shape is enough.
  - type: input
    id: matlab
    attributes:
      label: MATLAB version
      placeholder: e.g. R2026a (output of `version`)
    validations:
      required: true
  - type: input
    id: eeglab
    attributes:
      label: EEGLAB version and plugins
      placeholder: e.g. 2026.0.0, ICLabel 1.6, clean_rawdata 2.11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The dataset's shape (channels, rate, continuous/epoched, events), the plan and contract (or panel actions), what you clicked or ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command Window output
      description: The [NeuroQC] lines and any error message with its stack.
      render: text
