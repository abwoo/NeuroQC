name: Feature request
description: Suggest an improvement to PipeCompare
title: "[feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Area
      options:
        - Plan / processing steps
        - Evaluation and ranking
        - Panel / EEGLAB integration
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: The situation in your analysis, not just the feature name.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
    validations:
      required: true
