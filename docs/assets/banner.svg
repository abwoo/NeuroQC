<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-labelledby="t">
  <title id="t">PipeCompare: compare EEG preprocessing pipelines in EEGLAB</title>
  <style>
    .ink  { fill: #1f2328; }
    .sub  { fill: #59636e; }
    .line { stroke: #c9d1d9; }
    .dot  { fill: #c9d1d9; }
    .acc  { stroke: #2f6fed; }
    .accf { fill: #2f6fed; }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #f0f6fc; }
      .sub  { fill: #9198a1; }
      .line { stroke: #3d444d; }
      .dot  { fill: #3d444d; }
      .acc  { stroke: #4c8dff; }
      .accf { fill: #4c8dff; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Mark: one input branches into three pipelines; one is chosen -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path class="line" d="M64 120 C 104 120, 104 76, 144 76 H 208"/>
    <path class="line" d="M64 120 C 104 120, 104 164, 144 164 H 184"/>
    <path class="acc"  d="M64 120 H 232"/>
  </g>
  <circle class="accf" cx="64" cy="120" r="10"/>
  <circle class="dot"  cx="208" cy="76"  r="8"/>
  <circle class="dot"  cx="184" cy="164" r="8"/>
  <circle class="accf" cx="232" cy="120" r="12"/>

  <text class="ink" x="288" y="128" font-size="64" font-weight="600" letter-spacing="-1">PipeCompare</text>
  <text class="sub" x="290" y="170" font-size="22">Compare EEG preprocessing pipelines in EEGLAB</text>
</svg>
